<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial;
            max-width: 900px;
            margin: 40px auto;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        a {
            color: red;
        }
    </style>
</head>

<body>

<h1>Student Management System</h1>

<div class="card">
    <h2>Add Student</h2>

    <form method="POST" action="/add">
        <input name="name" placeholder="Student Name" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="course" placeholder="Course" required>
        <button type="submit">Add Student</button>
    </form>
</div>

<div class="card">
    <h2>Students</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Action</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>
                <a href="/delete/{{ student[0] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
